<title>DUSKLINE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Écran de chargement : même direction artistique que l'écran titre du jeu (inspiré des menus de Call of Duty) :
   photo assombrie comme au cinéma, logo DUSKLINE (logo.png, Higgsfield) au centre avec des bandes glitch orange,
   barre de chargement fine et biseautée, textes en capitales Barlow Condensed. */
:root {
  --ink: #0e1418; --paper: #ecf0e8; --blaze: #ff7a2f;
  --font: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--font); font-weight: 600;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: var(--ink); }
#loader { position: fixed; inset: 0; display: grid; place-items: center;
  background:
    linear-gradient(180deg, rgba(14,20,24,.55), rgba(14,20,24,.05) 40%, rgba(14,20,24,.3) 62%, rgba(14,20,24,.9)),
    linear-gradient(90deg, rgba(14,20,24,.6), rgba(14,20,24,0) 50%, rgba(14,20,24,.6)),
    url("menu.jpg") 30% center / cover no-repeat, var(--ink);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.card { width: min(720px, 92vw); display: grid; gap: 30px; justify-items: center; }
.logo { position: relative; width: 100%; aspect-ratio: 1100 / 346; }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.logo i { position: absolute; display: block; }
.logo i:nth-child(1) { left: -16%; right: 70%; top: 36%; bottom: 50%; background: rgba(255,122,47,.85); }
.logo i:nth-child(2) { left: 58%; right: -14%; top: 58%; bottom: 30%; background: rgba(255,122,47,.7); }
.logo i:nth-child(3) { left: -6%; right: 78%; top: 74%; bottom: 20%; background: rgba(0,0,0,.7); }
.logo i:nth-child(4) { left: 70%; right: -4%; top: 16%; bottom: 76%; background: rgba(0,0,0,.6); }
.logo i:nth-child(5) { left: 40%; right: 38%; top: 86%; bottom: 10%; background: rgba(255,122,47,.55); }
.bar { width: min(420px, 80vw); height: 10px; background: rgba(255,255,255,.08); transform: skewX(-18deg); overflow: hidden; border: 1px solid rgba(236,240,232,.2); }
.bar b { display: block; height: 100%; width: 0; background: var(--blaze); transition: width .2s; }
.status { margin: -14px 0 0; font-weight: 800; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,.85); }
.hint { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom, 0px)); margin: 0; padding: 0 20px; text-align: center;
  font-size: 16px; letter-spacing: .04em; color: rgba(236,240,232,.75); text-shadow: 0 2px 0 rgba(0,0,0,.85); }
.error { color: #ef8f7f; text-transform: none; letter-spacing: 0; }
@media (orientation: portrait) { .card { width: 92vw; } }
@media (prefers-reduced-motion: reduce) { .bar b { transition: none; } }
</style>

<canvas id="canvas" tabindex="0">Ton navigateur ne peut pas afficher le jeu.</canvas>

<div id="loader">
  <div class="card">
    <div class="logo"><i></i><i></i><i></i><i></i><i></i><img src="logo.png" alt="DUSKLINE — duel de snipers"></div>
    <div class="bar"><b id="progress"></b></div>
    <p class="status" id="status">Chargement du moteur…</p>
  </div>
  <p class="hint">Sur téléphone, joue debout ou couché · Sur ordinateur : ZQSD, souris, Maj pour courir</p>
</div>

<script>
// Le moteur Godot (40 Mo) est publié compressé (index.wasm.gz, 10 Mo) :
// on le décompresse ici, dans le navigateur, au moment où Godot le demande.
(function () {
  const nativeFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : input.url;
    if (/index\.pck(\?|$)/.test(url)) {
      // Les données du jeu sont publiées sous un nom en .wasm (seuls certains types de fichiers sont servis).
      return nativeFetch('donnees-pck.wasm', init).then((res) => new Response(res.body, { status: res.status, headers: { 'Content-Type': 'application/octet-stream' } }));
    }
    if (/index\.wasm(\?|$)/.test(url)) {
      return nativeFetch('moteur-gz.wasm', init).then((res) => {
        if (!res.ok) throw new Error('Moteur introuvable (' + res.status + ')');
        const body = res.body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(body, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
      });
    }
    return nativeFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8965272,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[]};
(function () {
  const loader = document.getElementById('loader');
  const bar = document.getElementById('progress');
  const status = document.getElementById('status');
  function fail(err) {
    console.error(err);
    status.classList.add('error');
    status.textContent = 'Le jeu n\'a pas pu démarrer : ' + (err && err.message ? err.message : err);
  }
  if (typeof DecompressionStream === 'undefined') {
    fail(new Error('ce navigateur est trop ancien (mets à jour Safari ou Chrome).'));
    return;
  }
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) {
    fail(new Error('il manque ' + missing.join(', ')));
    return;
  }
  const engine = new Engine(GODOT_CONFIG);
  engine.startGame({
    onProgress(current, total) {
      if (current > 0 && total > 0) {
        bar.style.width = Math.round(current / total * 100) + '%';
        status.textContent = 'Chargement… ' + Math.round(current / total * 100) + ' %';
      }
    },
  }).then(() => { loader.hidden = true; }, fail);
})();
</script>
